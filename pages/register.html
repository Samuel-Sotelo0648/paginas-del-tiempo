<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <main>

        <section class="register-form">

            <div class="register-form-container">
                <h2>CREAR CUENTA</h2>

                <p>
                    <strong>Únete a Páginas del Tiempo y disfruta de una experiencia literaria única.</strong>
                </p>

                <form action="#" method="post" id="registerForm">

                    <div class="form-group">
                        <label for="full-name">Nombre Completo: (<span>*</span>)</label>
                        <input type="text" id="full-name" name="full-name" placeholder="Ej: John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="email"> Correo electrónico: (<span>*</span>)</label>
                        <input type="email" name="email" id="email" placeholder="Ej: johndoe@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Número de teléfono: (<span>*</span>)</label>
                        <input type="number" name="phone" id="phone" placeholder="Ej: 3001234567" required>
                    </div>

                    <div class="form-group">
                        <label for="address">Direccion: (<span>*</span>)</label>
                        <input type="text" name="address" id="address" placeholder="Ej: Calle 1 #23 - 45">
                    </div>

                    
                    <div class="form-group"></div>
                    <div class="form-group"></div>

                </form>

            </div>

        </section>

    </main>

</body>

</html>
